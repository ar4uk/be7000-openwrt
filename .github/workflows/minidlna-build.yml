name: MiniDLNA package build

on:
  push:
    branches:
      - minidlna-feed
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-minidlna:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout BeamWRT source
        uses: actions/checkout@v4
        with:
          ref: minidlna-feed

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget libelf-dev libzstd-dev xsltproc

      - name: Fetch exact OpenWrt base
        run: |
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git owrt
          cd owrt
          git checkout d958caff0c9ffa215dceb0718caad7d4955d8954

      - name: Apply BeamWRT target port
        run: |
          cd owrt
          git config user.name "BeamWRT Build"
          git config user.email "beamwrt-build@users.noreply.github.com"
          git am "$GITHUB_WORKSPACE"/patches/port/*.patch

      - name: Pin and install the packages feed
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i -E "s|^(src-git(-full)? $name [^ ^;]+).*$|\\1^$rev|" feeds.conf.default
          done < "$GITHUB_WORKSPACE/feeds-pins.txt"
          ./scripts/feeds update packages
          ./scripts/feeds install minidlna

      - name: Add MiniDLNA FFmpeg 7 compatibility patch
        run: |
          mkdir -p owrt/feeds/packages/multimedia/minidlna/patches
          cat > owrt/feeds/packages/multimedia/minidlna/patches/999-ffmpeg7-compat.patch <<'PATCH'
--- a/libav.h
+++ b/libav.h
@@ -174,7 +174,11 @@ lav_get_interlaced(AVStream *s)
 #define lav_codec_tag(s) s->codecpar->codec_tag
 #define lav_sample_rate(s) s->codecpar->sample_rate
 #define lav_bit_rate(s) s->codecpar->bit_rate
+#if LIBAVUTIL_VERSION_INT >= ((57<<16)+(28<<8)+100)
+#define lav_channels(s) s->codecpar->ch_layout.nb_channels
+#else
 #define lav_channels(s) s->codecpar->channels
+#endif
 #define lav_width(s) s->codecpar->width
 #define lav_height(s) s->codecpar->height
 #define lav_profile(s) s->codecpar->profile
PATCH
          test -s owrt/feeds/packages/multimedia/minidlna/patches/999-ffmpeg7-compat.patch
          echo "FFmpeg 7 compatibility patch added to the OpenWrt package patch series"

      - name: Configure the BE7000 package target
        run: |
          cd owrt
          cp "$GITHUB_WORKSPACE/config.buildinfo" .config
          make defconfig
          # Select package targets after defconfig to preserve the BE7000 baseline.
          echo 'CONFIG_PACKAGE_minidlna=m' >> .config
          echo 'CONFIG_PACKAGE_libffmpeg=m' >> .config
          echo 'CONFIG_PACKAGE_libdrm=m' >> .config
          echo 'CONFIG_PACKAGE_libopus=m' >> .config
          echo 'CONFIG_PACKAGE_lame-lib=m' >> .config
          echo "===== TARGET ====="
          grep -E '^(CONFIG_TARGET_|CONFIG_ARCH=)' .config | head -30
          echo "===== SELECTED PACKAGES ====="
          grep -E '^CONFIG_PACKAGE_(minidlna|libffmpeg|libdrm|libopus|lame-lib)=' .config
          grep -q '^CONFIG_PACKAGE_minidlna=m$' .config
          grep -q '^CONFIG_PACKAGE_libffmpeg=m$' .config
          grep -q '^CONFIG_PACKAGE_libdrm=m$' .config
          grep -q '^CONFIG_PACKAGE_libopus=m$' .config
          grep -q '^CONFIG_PACKAGE_lame-lib=m$' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx=y$' .config

      - name: Build host tools and target toolchain
        run: |
          cd owrt
          make -j2 tools/install toolchain/install

      - name: Build target kernel and modules
        run: |
          cd owrt
          make -j2 target/linux/compile V=s

      - name: Build MiniDLNA and its dependencies
        run: |
          cd owrt
          make -j2 package/feeds/packages/minidlna/compile V=s

      - name: Create package index and checksums
        run: |
          cd owrt
          make package/index
          cd bin/packages/aarch64_cortex-a73/packages
          sha256sum *.apk > SHA256SUMS
          ls -lh

      - name: Upload unsigned package set for inspection
        uses: actions/upload-artifact@v4
        with:
          name: minidlna-aarch64_cortex-a73-unsigned
          path: owrt/bin/packages/aarch64_cortex-a73/packages/
          if-no-files-found: error
          retention-days: 14
