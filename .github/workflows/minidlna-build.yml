name: MiniDLNA package build

on:
  push:
    branches:
      - minidlna-feed
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-minidlna:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout BeamWRT source
        uses: actions/checkout@v4
        with:
          ref: minidlna-feed

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget libelf-dev libzstd-dev xsltproc

      - name: Fetch exact OpenWrt base
        run: |
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git owrt
          cd owrt
          git checkout d958caff0c9ffa215dceb0718caad7d4955d8954

      - name: Apply BeamWRT target port
        run: |
          cd owrt
          git config user.name "BeamWRT Build"
          git config user.email "beamwrt-build@users.noreply.github.com"
          git am "$GITHUB_WORKSPACE"/patches/port/*.patch

      - name: Pin and install the packages feed
        run: |
          cd owrt
          while read -r name rev _; do
            [ -n "$name" ] || continue
            sed -i -E "s|^(src-git(-full)? $name [^ ^;]+).*$|\\1^$rev|" feeds.conf.default
          done < "$GITHUB_WORKSPACE/feeds-pins.txt"
          ./scripts/feeds update packages
          ./scripts/feeds install minidlna

      - name: Configure the BE7000 package target
        run: |
          cd owrt
          cp "$GITHUB_WORKSPACE/config.buildinfo" .config
          echo 'CONFIG_PACKAGE_minidlna=m' >> .config
          echo 'CONFIG_PACKAGE_libffmpeg=m' >> .config
          make defconfig
          echo "===== TARGET ====="
          grep -E '^(CONFIG_TARGET_|CONFIG_ARCH=)' .config | head -30
          echo "===== MINIDLNA CONFIG ====="
          grep -E '^(CONFIG_PACKAGE_(minidlna|libffmpeg|libffmpeg-audio-dec)=|# CONFIG_PACKAGE_(minidlna|libffmpeg|libffmpeg-audio-dec) is not set)' .config || true
          grep -q '^CONFIG_PACKAGE_minidlna=m$' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx=y$' .config

      - name: Build host tools and target toolchain
        run: |
          cd owrt
          make -j2 tools/install toolchain/install

      - name: Build MiniDLNA and its dependencies
        run: |
          cd owrt
          make -j2 package/feeds/packages/minidlna/compile V=s

      - name: Create package index and checksums
        run: |
          cd owrt
          make package/index
          cd bin/packages/aarch64_cortex-a73/packages
          sha256sum *.apk > SHA256SUMS
          ls -lh

      - name: Upload unsigned package set for inspection
        uses: actions/upload-artifact@v4
        with:
          name: minidlna-aarch64_cortex-a73-unsigned
          path: |
            owrt/bin/packages/aarch64_cortex-a73/packages/
          if-no-files-found: error
          retention-days: 14
